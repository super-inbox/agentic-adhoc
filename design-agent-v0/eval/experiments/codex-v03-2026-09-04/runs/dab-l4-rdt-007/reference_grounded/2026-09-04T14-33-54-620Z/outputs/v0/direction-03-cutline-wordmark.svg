<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#151722" flood-opacity="0.19"/>
    </filter>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DADBDF"/>
      <stop offset="1" stop-color="#C8CAD0"/>
    </linearGradient>
    <mask id="bCut">
      <rect width="64" height="64" fill="white"/>
      <rect x="0" y="33" width="64" height="5" fill="black"/>
    </mask>
    <symbol id="bMark" viewBox="0 0 64 64">
      <path fill="currentColor" fill-rule="evenodd" mask="url(#bCut)" d="M8 5H34C48 5 56 12 56 23.5C56 30 52.5 35 47 37.5C54 40 58 46 58 52.5C58 59 53 62 46 62H8V5ZM22 16V30H33C39 30 42 27.5 42 23C42 18.5 39 16 33 16H22ZM22 43V53H35C41 53 44 51.5 44 48C44 44.5 41 43 35 43H22Z"/>
    </symbol>
    <pattern id="baseline" width="40" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 27.5H40" stroke="#FFFFFF" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1600" height="1100" fill="#EFF0F3"/>
  <rect x="0" y="0" width="18" height="1100" fill="#E46450"/>

  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" fill="#1A1C26">
    <text x="78" y="70" font-size="15" font-weight="700" letter-spacing="3">DIRECTION 03</text>
    <text x="78" y="125" font-size="46" font-weight="600" letter-spacing="-1">Cutline Wordmark</text>
    <text x="78" y="160" font-size="18" font-weight="400" fill="#626673">A bold typographic identity with a calibrated interruption.</text>

    <g transform="translate(1070,58)">
      <text x="0" y="0" font-size="12" font-weight="700" letter-spacing="2.2" fill="#727683">POSITION</text>
      <text x="0" y="30" font-size="16" font-weight="500">Editorial / Direct / Contemporary</text>
      <rect x="0" y="54" width="54" height="16" rx="8" fill="#263FC5"/>
      <rect x="64" y="54" width="54" height="16" rx="8" fill="#E46450"/>
      <rect x="128" y="54" width="54" height="16" rx="8" fill="#1A1C26"/>
      <rect x="192" y="54" width="54" height="16" rx="8" fill="#F8F7F2" stroke="#D2D3D7"/>
    </g>

    <rect x="70" y="215" width="920" height="390" rx="8" fill="#263FC5"/>
    <rect x="70" y="215" width="920" height="390" rx="8" fill="url(#baseline)"/>
    <text x="110" y="260" font-size="12" font-weight="700" letter-spacing="2.2" fill="#B9C3FF">PRIMARY LOGO / PLACEHOLDER NAME</text>
    <text x="110" y="435" font-family="Helvetica Neue, Arial, sans-serif" font-size="146" font-weight="800" letter-spacing="3" fill="#F8F7F2" transform="scale(.91 1) translate(11 0)">BRAND</text>
    <rect x="105" y="357" width="820" height="10" fill="#263FC5"/>
    <rect x="105" y="369" width="820" height="3" fill="#E46450"/>
    <text x="115" y="495" font-size="13" font-weight="700" letter-spacing="4.4" fill="#B9C3FF">LAMINATE SURFACES</text>
    <text x="115" y="540" font-size="12" font-weight="500" fill="#8FA0F0">Name and initial are intentionally provisional</text>
    <g transform="translate(835,488)" color="#F8F7F2">
      <use href="#bMark" width="92" height="92"/>
    </g>
    <text x="880" y="583" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1.2" fill="#B9C3FF">INITIAL / COMPACT MARK</text>

    <g transform="translate(1035,215)">
      <text x="0" y="19" font-size="12" font-weight="700" letter-spacing="2.2" fill="#777B87">DESIGN LOGIC</text>
      <line x1="0" y1="42" x2="485" y2="42" stroke="#CCCDD2"/>
      <text x="0" y="83" font-size="20" font-weight="600">The name is the identity.</text>
      <text x="0" y="112" font-size="20" font-weight="600">A cut reveals the system.</text>
      <text x="0" y="159" font-size="15" fill="#626673">A consistent interruption references machining</text>
      <text x="0" y="183" font-size="15" fill="#626673">and section drawings—without a pictogram.</text>
      <text x="0" y="230" font-size="12" font-weight="700" letter-spacing="2.1" fill="#777B87">SYSTEM BEHAVIOUR</text>
      <g font-size="15" fill="#444854">
        <line x1="0" y1="265" x2="9" y2="265" stroke="#E46450" stroke-width="3"/><text x="20" y="270">Cutline runs through type and data</text>
        <line x1="0" y1="299" x2="9" y2="299" stroke="#E46450" stroke-width="3"/><text x="20" y="304">Initial becomes the compact identifier</text>
        <line x1="0" y1="333" x2="9" y2="333" stroke="#E46450" stroke-width="3"/><text x="20" y="338">High impact on covers and signage</text>
      </g>
    </g>

    <rect x="70" y="645" width="500" height="385" rx="8" fill="#FAF9F6"/>
    <text x="110" y="690" font-size="12" font-weight="700" letter-spacing="2.2" fill="#777B87">STRESS TEST 01 / FAVICON</text>
    <text x="110" y="722" font-size="16" fill="#444854">The initial carries the cut at compact sizes.</text>

    <g transform="translate(110,770)">
      <rect x="0" y="0" width="150" height="150" rx="32" fill="#263FC5"/>
      <g transform="translate(35,34)" color="#F8F7F2">
        <use href="#bMark" width="80" height="80"/>
      </g>
      <rect x="35" y="76" width="80" height="4" fill="#E46450"/>
      <text x="0" y="181" font-size="12" font-weight="600" fill="#777B87">ENLARGED PROOF</text>
    </g>

    <g transform="translate(310,790)">
      <text x="0" y="-20" font-size="12" font-weight="700" letter-spacing="1.4" fill="#777B87">ACTUAL PIXELS</text>
      <rect x="0" y="0" width="52" height="52" rx="8" fill="#E7E8ED"/>
      <g color="#263FC5"><use href="#bMark" x="18" y="18" width="16" height="16"/></g>
      <text x="70" y="31" font-size="14" fill="#444854">16 px</text>
      <rect x="0" y="70" width="52" height="52" rx="8" fill="#E7E8ED"/>
      <g color="#263FC5"><use href="#bMark" x="14" y="84" width="24" height="24"/></g>
      <text x="70" y="101" font-size="14" fill="#444854">24 px</text>
      <rect x="0" y="140" width="52" height="52" rx="8" fill="#E7E8ED"/>
      <g color="#263FC5"><use href="#bMark" x="10" y="150" width="32" height="32"/></g>
      <text x="70" y="171" font-size="14" fill="#444854">32 px</text>
      <text x="0" y="225" font-size="12" fill="#777B87">Proposed minimum: 16 px</text>
    </g>

    <rect x="610" y="645" width="920" height="385" rx="8" fill="url(#desk)"/>
    <text x="650" y="690" font-size="12" font-weight="700" letter-spacing="2.2" fill="#5C606C">STRESS TEST 02 / SAMPLE-BOOK COVER</text>
    <text x="650" y="722" font-size="16" fill="#444854">210 × 297 mm cover / editorial range presence.</text>

    <g filter="url(#shadow)" transform="translate(785,750)">
      <polygon points="0,16 18,0 246,0 228,16" fill="#5364CE"/>
      <polygon points="228,16 246,0 246,270 228,288" fill="#111B74"/>
      <rect x="0" y="16" width="228" height="272" fill="#263FC5"/>
      <rect x="0" y="152" width="228" height="3" fill="#E46450"/>
      <text x="-8" y="168" font-family="Helvetica Neue, Arial, sans-serif" font-size="170" font-weight="800" fill="#F8F7F2" opacity="0.13">B</text>
      <rect x="0" y="145" width="228" height="8" fill="#263FC5"/>
      <text x="25" y="62" font-size="8" font-weight="700" letter-spacing="2.3" fill="#B9C3FF">LAMINATE SURFACES</text>
      <text x="25" y="205" font-family="Helvetica Neue, Arial, sans-serif" font-size="29" font-weight="800" letter-spacing="1.4" fill="#F8F7F2">BRAND</text>
      <rect x="22" y="188" width="184" height="3.5" fill="#263FC5"/>
      <rect x="22" y="193" width="184" height="1.5" fill="#E46450"/>
      <text x="25" y="238" font-size="9" font-weight="700" letter-spacing="1.6" fill="#B9C3FF">SIGNATURE / 01</text>
      <text x="25" y="258" font-size="9" fill="#9EACF5">Architectural surface collection</text>
    </g>

    <g transform="translate(1110,770)">
      <text x="0" y="0" font-size="12" font-weight="700" letter-spacing="2" fill="#5C606C">COVER RULES</text>
      <line x1="0" y1="20" x2="330" y2="20" stroke="#A9ABB1"/>
      <text x="0" y="56" font-size="15" fill="#444854">01  Overscale initial adds shelf impact</text>
      <text x="0" y="91" font-size="15" fill="#444854">02  Cutline aligns title and range data</text>
      <text x="0" y="126" font-size="15" fill="#444854">03  Strong colour blocks aid navigation</text>
      <rect x="0" y="160" width="330" height="62" rx="5" fill="#E2E3E7"/>
      <text x="18" y="187" font-size="11" font-weight="700" letter-spacing="1.5" fill="#727683">TACTILE NOTE</text>
      <text x="18" y="207" font-size="13" fill="#444854">Duplex board + recessed cutline</text>
    </g>
  </g>

  <text x="80" y="1072" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.7" fill="#777B87">CONCEPT BOARD • NOT SELECTED • NAME/INITIAL PENDING CLIENT NAME</text>
  <text x="1520" y="1072" text-anchor="end" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.7" fill="#777B87">V0 / 03</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0E2C28" flood-opacity="0.17"/>
    </filter>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9D5CA"/>
      <stop offset="1" stop-color="#C9C4B7"/>
    </linearGradient>
    <symbol id="moduleMark" viewBox="0 0 64 64">
      <path d="M4 4H29V13H13V29H4V4Z" fill="currentColor"/>
      <path d="M35 4H60V29H51V13H35V4Z" fill="currentColor"/>
      <path d="M35 51H51V35H60V60H35V51Z" fill="currentColor"/>
      <path d="M4 35H13V51H29V60H4V35Z" fill="currentColor"/>
      <rect x="27" y="27" width="10" height="10" rx="1.5" fill="#D8AA35"/>
    </symbol>
    <pattern id="moduleGrid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M0 0H52V52H0Z" fill="none" stroke="#F3EFE5" stroke-opacity="0.1"/>
      <rect x="23" y="23" width="6" height="6" fill="#D8AA35" fill-opacity="0.72"/>
    </pattern>
  </defs>

  <rect width="1600" height="1100" fill="#ECE8DE"/>
  <rect x="0" y="0" width="18" height="1100" fill="#D8AA35"/>

  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" fill="#143A35">
    <text x="78" y="70" font-size="15" font-weight="700" letter-spacing="3">DIRECTION 02</text>
    <text x="78" y="125" font-size="46" font-weight="600" letter-spacing="-1">Modular Field</text>
    <text x="78" y="160" font-size="18" font-weight="400" fill="#536A65">A repeatable kit built for portfolios at scale.</text>

    <g transform="translate(1070,58)">
      <text x="0" y="0" font-size="12" font-weight="700" letter-spacing="2.2" fill="#687773">POSITION</text>
      <text x="0" y="30" font-size="16" font-weight="500">Systematic / Adaptable / Confident</text>
      <rect x="0" y="54" width="54" height="16" rx="2" fill="#143A35"/>
      <rect x="64" y="54" width="54" height="16" rx="2" fill="#D8AA35"/>
      <rect x="128" y="54" width="54" height="16" rx="2" fill="#8A9A89"/>
      <rect x="192" y="54" width="54" height="16" rx="2" fill="#F6F2E8" stroke="#D2CEC3"/>
    </g>

    <rect x="70" y="215" width="920" height="390" rx="8" fill="#143A35"/>
    <rect x="70" y="215" width="920" height="390" rx="8" fill="url(#moduleGrid)"/>
    <text x="110" y="260" font-size="12" font-weight="700" letter-spacing="2.2" fill="#A7B7B2">PRIMARY LOCKUP / PLACEHOLDER NAME</text>

    <g transform="translate(170,300)" color="#F6F2E8">
      <use href="#moduleMark" width="180" height="180"/>
    </g>
    <g transform="translate(410,330)">
      <text x="0" y="85" font-size="88" font-weight="600" letter-spacing="-3" fill="#F6F2E8">brand</text>
      <rect x="314" y="68" width="13" height="13" rx="2" fill="#D8AA35"/>
      <text x="4" y="128" font-size="13" font-weight="700" letter-spacing="3.8" fill="#A7B7B2">LAMINATE SURFACES</text>
      <text x="4" y="172" font-size="12" font-weight="500" fill="#7F9992">Name is intentionally provisional</text>
    </g>
    <g transform="translate(805,530)">
      <rect x="0" y="0" width="145" height="34" rx="17" fill="#F6F2E8" fill-opacity="0.10"/>
      <text x="72.5" y="22" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.3" fill="#D8AA35">EXPANDABLE KIT</text>
    </g>

    <g transform="translate(1035,215)">
      <text x="0" y="19" font-size="12" font-weight="700" letter-spacing="2.2" fill="#75837F">DESIGN LOGIC</text>
      <line x1="0" y1="42" x2="485" y2="42" stroke="#C9C6BC"/>
      <text x="0" y="83" font-size="20" font-weight="600">Four corners form a field.</text>
      <text x="0" y="112" font-size="20" font-weight="600">The centre becomes the signal.</text>
      <text x="0" y="159" font-size="15" fill="#536A65">A modular mark that grows naturally into</text>
      <text x="0" y="183" font-size="15" fill="#536A65">range codes, patterns and spatial graphics.</text>
      <text x="0" y="230" font-size="12" font-weight="700" letter-spacing="2.1" fill="#75837F">SYSTEM BEHAVIOUR</text>
      <g font-size="15" fill="#35534D">
        <rect x="1" y="260" width="7" height="7" rx="1" fill="#D8AA35"/><text x="20" y="270">Modules map product families</text>
        <rect x="1" y="294" width="7" height="7" rx="1" fill="#D8AA35"/><text x="20" y="304">Field scales from label to showroom</text>
        <rect x="1" y="328" width="7" height="7" rx="1" fill="#D8AA35"/><text x="20" y="338">Strong shelf recognition across ranges</text>
      </g>
    </g>

    <rect x="70" y="645" width="500" height="385" rx="8" fill="#F8F5ED"/>
    <text x="110" y="690" font-size="12" font-weight="700" letter-spacing="2.2" fill="#75837F">STRESS TEST 01 / FAVICON</text>
    <text x="110" y="722" font-size="16" fill="#35534D">Corners remain legible; centre stays distinctive.</text>

    <g transform="translate(110,770)">
      <rect x="0" y="0" width="150" height="150" rx="20" fill="#F0EBDF" stroke="#D9D4C8"/>
      <g transform="translate(35,35)" color="#143A35">
        <use href="#moduleMark" width="80" height="80"/>
      </g>
      <text x="0" y="181" font-size="12" font-weight="600" fill="#75837F">ENLARGED PROOF</text>
    </g>

    <g transform="translate(310,790)">
      <text x="0" y="-20" font-size="12" font-weight="700" letter-spacing="1.4" fill="#75837F">ACTUAL PIXELS</text>
      <rect x="0" y="0" width="52" height="52" rx="8" fill="#E9E4D8"/>
      <g color="#143A35"><use href="#moduleMark" x="18" y="18" width="16" height="16"/></g>
      <text x="70" y="31" font-size="14" fill="#35534D">16 px</text>
      <rect x="0" y="70" width="52" height="52" rx="8" fill="#E9E4D8"/>
      <g color="#143A35"><use href="#moduleMark" x="14" y="84" width="24" height="24"/></g>
      <text x="70" y="101" font-size="14" fill="#35534D">24 px</text>
      <rect x="0" y="140" width="52" height="52" rx="8" fill="#E9E4D8"/>
      <g color="#143A35"><use href="#moduleMark" x="10" y="150" width="32" height="32"/></g>
      <text x="70" y="171" font-size="14" fill="#35534D">32 px</text>
      <text x="0" y="225" font-size="12" fill="#75837F">Proposed minimum: 16 px</text>
    </g>

    <rect x="610" y="645" width="920" height="385" rx="8" fill="url(#desk)"/>
    <text x="650" y="690" font-size="12" font-weight="700" letter-spacing="2.2" fill="#5D6B67">STRESS TEST 02 / SAMPLE-BOOK COVER</text>
    <text x="650" y="722" font-size="16" fill="#35534D">210 × 297 mm cover / coded family system.</text>

    <g filter="url(#shadow)" transform="translate(785,750)">
      <polygon points="0,16 18,0 246,0 228,16" fill="#F5F1E7"/>
      <polygon points="228,16 246,0 246,270 228,288" fill="#B58A22"/>
      <rect x="0" y="16" width="228" height="272" fill="#F6F2E8"/>
      <rect x="0" y="16" width="12" height="272" fill="#D8AA35"/>
      <g transform="translate(28,42)" color="#143A35">
        <use href="#moduleMark" width="52" height="52"/>
      </g>
      <text x="28" y="140" font-size="30" font-weight="600" letter-spacing="-1" fill="#143A35">brand<tspan fill="#D8AA35">.</tspan></text>
      <text x="29" y="165" font-size="7.5" font-weight="700" letter-spacing="2.1" fill="#6C7B76">LAMINATE SURFACES</text>
      <g opacity="0.95">
        <path d="M154 177H228V251H219V186H154Z" fill="#143A35"/>
        <path d="M168 199H228V259H219V208H168Z" fill="#7D9187"/>
        <rect x="196" y="227" width="32" height="32" fill="#D8AA35"/>
      </g>
      <text x="29" y="241" font-size="9" font-weight="700" letter-spacing="1.5" fill="#143A35">M01 / ESSENTIALS</text>
      <text x="29" y="260" font-size="9" fill="#6C7B76">Commercial surface range</text>
    </g>

    <g transform="translate(1110,770)">
      <text x="0" y="0" font-size="12" font-weight="700" letter-spacing="2" fill="#5D6B67">COVER RULES</text>
      <line x1="0" y1="20" x2="330" y2="20" stroke="#A9A398"/>
      <text x="0" y="56" font-size="15" fill="#35534D">01  Accent tile codes each collection</text>
      <text x="0" y="91" font-size="15" fill="#35534D">02  Modules crop into flexible graphics</text>
      <text x="0" y="126" font-size="15" fill="#35534D">03  Light base supports material swatches</text>
      <rect x="0" y="160" width="330" height="62" rx="5" fill="#E5DFD2"/>
      <text x="18" y="187" font-size="11" font-weight="700" letter-spacing="1.5" fill="#687773">TACTILE NOTE</text>
      <text x="18" y="207" font-size="13" fill="#35534D">Soft-touch stock + spot-gloss centre</text>
    </g>
  </g>

  <text x="80" y="1072" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.7" fill="#75837F">CONCEPT BOARD • NOT SELECTED • WORDMARK PENDING CLIENT NAME</text>
  <text x="1520" y="1072" text-anchor="end" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.7" fill="#75837F">V0 / 02</text>
</svg>

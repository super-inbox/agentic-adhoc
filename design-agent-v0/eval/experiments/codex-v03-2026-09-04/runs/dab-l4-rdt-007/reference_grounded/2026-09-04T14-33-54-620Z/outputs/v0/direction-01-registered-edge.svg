<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#101820" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCD7CD"/>
      <stop offset="1" stop-color="#CFC8BB"/>
    </linearGradient>
    <symbol id="edgeMark" viewBox="0 0 64 64">
      <path d="M7 10H42L57 25H22L7 10Z" fill="#17242B"/>
      <path d="M7 34H42L57 49H22L7 34Z" fill="#17242B"/>
      <rect x="12" y="6" width="5" height="48" rx="2.5" fill="#C87550"/>
    </symbol>
    <pattern id="fineGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#17242B" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1100" fill="#F1EEE6"/>
  <rect x="0" y="0" width="18" height="1100" fill="#C87550"/>

  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" fill="#17242B">
    <text x="78" y="70" font-size="15" font-weight="700" letter-spacing="3">DIRECTION 01</text>
    <text x="78" y="125" font-size="46" font-weight="600" letter-spacing="-1">Registered Edge</text>
    <text x="78" y="160" font-size="18" font-weight="400" fill="#566168">Measured planes, aligned with intent.</text>

    <g transform="translate(1070,58)">
      <text x="0" y="0" font-size="12" font-weight="700" letter-spacing="2.2" fill="#6B7376">POSITION</text>
      <text x="0" y="30" font-size="16" font-weight="500">Precise / Architectural / Assured</text>
      <rect x="0" y="54" width="54" height="16" rx="8" fill="#17242B"/>
      <rect x="64" y="54" width="54" height="16" rx="8" fill="#C87550"/>
      <rect x="128" y="54" width="54" height="16" rx="8" fill="#D7D1C5"/>
      <rect x="192" y="54" width="54" height="16" rx="8" fill="#F8F6F0" stroke="#D7D1C5"/>
    </g>

    <rect x="70" y="215" width="920" height="390" rx="8" fill="#FAF8F3"/>
    <rect x="70" y="215" width="920" height="390" rx="8" fill="url(#fineGrid)"/>
    <text x="110" y="260" font-size="12" font-weight="700" letter-spacing="2.2" fill="#7B807F">PRIMARY LOCKUP / PLACEHOLDER NAME</text>

    <g transform="translate(135,322)">
      <use href="#edgeMark" width="166" height="166"/>
      <path d="M76 -14V180M-14 83H180" stroke="#C87550" stroke-width="1" stroke-dasharray="4 7" opacity="0.42"/>
      <circle cx="83" cy="83" r="92" fill="none" stroke="#17242B" stroke-opacity="0.11"/>
    </g>
    <g transform="translate(382,365)">
      <text x="0" y="73" font-size="68" font-weight="600" letter-spacing="10">BRAND</text>
      <line x1="2" y1="102" x2="422" y2="102" stroke="#C87550" stroke-width="3"/>
      <text x="2" y="136" font-size="14" font-weight="600" letter-spacing="4.2" fill="#566168">LAMINATE SURFACES</text>
      <text x="2" y="178" font-size="12" font-weight="500" fill="#8A8F90">Name is intentionally provisional</text>
    </g>

    <g transform="translate(1035,215)">
      <text x="0" y="19" font-size="12" font-weight="700" letter-spacing="2.2" fill="#7B807F">DESIGN LOGIC</text>
      <line x1="0" y1="42" x2="485" y2="42" stroke="#CBC6BC"/>
      <text x="0" y="83" font-size="20" font-weight="600">Two surface planes.</text>
      <text x="0" y="112" font-size="20" font-weight="600">One registration datum.</text>
      <text x="0" y="159" font-size="15" fill="#566168">The offset geometry signals material</text>
      <text x="0" y="183" font-size="15" fill="#566168">accuracy without drawing a literal sheet.</text>
      <text x="0" y="230" font-size="12" font-weight="700" letter-spacing="2.1" fill="#7B807F">SYSTEM BEHAVIOUR</text>
      <g font-size="15" fill="#39454A">
        <circle cx="5" cy="265" r="3" fill="#C87550"/><text x="20" y="270">Datum line becomes a layout rule</text>
        <circle cx="5" cy="299" r="3" fill="#C87550"/><text x="20" y="304">Works in one ink for specifications</text>
        <circle cx="5" cy="333" r="3" fill="#C87550"/><text x="20" y="338">Calm enough for multi-range portfolios</text>
      </g>
    </g>

    <rect x="70" y="645" width="500" height="385" rx="8" fill="#FAF8F3"/>
    <text x="110" y="690" font-size="12" font-weight="700" letter-spacing="2.2" fill="#7B807F">STRESS TEST 01 / FAVICON</text>
    <text x="110" y="722" font-size="16" fill="#39454A">Sharp registration survives at UI scale.</text>

    <g transform="translate(110,770)">
      <rect x="0" y="0" width="150" height="150" rx="24" fill="#17242B"/>
      <g transform="translate(35,35)">
        <path d="M7 10H42L57 25H22L7 10Z" fill="#F8F6F0" transform="scale(1.25)"/>
        <path d="M7 34H42L57 49H22L7 34Z" fill="#F8F6F0" transform="scale(1.25)"/>
        <rect x="15" y="7.5" width="6.25" height="60" rx="3" fill="#C87550"/>
      </g>
      <text x="0" y="181" font-size="12" font-weight="600" fill="#7B807F">ENLARGED PROOF</text>
    </g>

    <g transform="translate(310,790)">
      <text x="0" y="-20" font-size="12" font-weight="700" letter-spacing="1.4" fill="#7B807F">ACTUAL PIXELS</text>
      <rect x="0" y="0" width="52" height="52" rx="8" fill="#EAE6DE"/>
      <use href="#edgeMark" x="18" y="18" width="16" height="16"/>
      <text x="70" y="31" font-size="14" fill="#39454A">16 px</text>
      <rect x="0" y="70" width="52" height="52" rx="8" fill="#EAE6DE"/>
      <use href="#edgeMark" x="14" y="84" width="24" height="24"/>
      <text x="70" y="101" font-size="14" fill="#39454A">24 px</text>
      <rect x="0" y="140" width="52" height="52" rx="8" fill="#EAE6DE"/>
      <use href="#edgeMark" x="10" y="150" width="32" height="32"/>
      <text x="70" y="171" font-size="14" fill="#39454A">32 px</text>
      <text x="0" y="225" font-size="12" fill="#7B807F">Proposed minimum: 16 px</text>
    </g>

    <rect x="610" y="645" width="920" height="385" rx="8" fill="url(#desk)"/>
    <text x="650" y="690" font-size="12" font-weight="700" letter-spacing="2.2" fill="#5E6668">STRESS TEST 02 / SAMPLE-BOOK COVER</text>
    <text x="650" y="722" font-size="16" fill="#39454A">210 × 297 mm cover / restrained range architecture.</text>

    <g filter="url(#shadow)" transform="translate(790,750)">
      <polygon points="0,16 18,0 246,0 228,16" fill="#334047"/>
      <polygon points="228,16 246,0 246,270 228,288" fill="#0D161B"/>
      <rect x="0" y="16" width="228" height="272" fill="#17242B"/>
      <rect x="0" y="16" width="7" height="272" fill="#C87550"/>
      <g transform="translate(26,44)">
        <path d="M7 10H42L57 25H22L7 10Z" fill="#F8F6F0"/>
        <path d="M7 34H42L57 49H22L7 34Z" fill="#F8F6F0"/>
        <rect x="12" y="6" width="5" height="48" rx="2.5" fill="#C87550"/>
      </g>
      <text x="28" y="145" font-size="25" font-weight="600" letter-spacing="4" fill="#F8F6F0">BRAND</text>
      <text x="28" y="173" font-size="8" font-weight="600" letter-spacing="2.4" fill="#C87550">LAMINATE SURFACES</text>
      <text x="28" y="242" font-size="9" font-weight="600" letter-spacing="1.6" fill="#BFC5C5">COLLECTION 01</text>
      <text x="28" y="260" font-size="9" fill="#8E999D">Architectural neutrals</text>
    </g>

    <g transform="translate(1110,770)">
      <text x="0" y="0" font-size="12" font-weight="700" letter-spacing="2" fill="#5E6668">COVER RULES</text>
      <line x1="0" y1="20" x2="330" y2="20" stroke="#AAA398"/>
      <text x="0" y="56" font-size="15" fill="#39454A">01  Datum stripe identifies each range</text>
      <text x="0" y="91" font-size="15" fill="#39454A">02  Mark remains compact and quiet</text>
      <text x="0" y="126" font-size="15" fill="#39454A">03  Spine reads across a studio shelf</text>
      <rect x="0" y="160" width="330" height="62" rx="5" fill="#E6E0D5"/>
      <text x="18" y="187" font-size="11" font-weight="700" letter-spacing="1.5" fill="#6B7376">TACTILE NOTE</text>
      <text x="18" y="207" font-size="13" fill="#39454A">Blind deboss mark + uncoated stock</text>
    </g>
  </g>

  <text x="80" y="1072" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.7" fill="#7B807F">CONCEPT BOARD • NOT SELECTED • WORDMARK PENDING CLIENT NAME</text>
  <text x="1520" y="1072" text-anchor="end" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.7" fill="#7B807F">V0 / 01</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800">
  <defs>
    <style>
      .sans { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; fill: #292825; }
      .serif { font-family: "Songti SC", "STSong", serif; fill: #292825; }
      .micro { font-size: 20px; letter-spacing: 2px; }
      .small { font-size: 25px; }
      .body { font-size: 27px; }
      .label { font-size: 22px; font-weight: 600; letter-spacing: 2px; }
      .route { font-size: 42px; font-weight: 650; }
      .white { fill: #FFFDF8; }
      .muted { fill: #6E675F; }
      .rule { stroke: #CFC2AD; stroke-width: 2; }
    </style>
    <clipPath id="clipA"><rect x="130" y="745" width="640" height="420"/></clipPath>
    <clipPath id="clipB"><rect x="880" y="745" width="640" height="420"/></clipPath>
    <clipPath id="clipC"><rect x="1630" y="745" width="640" height="420"/></clipPath>
  </defs>

  <rect width="2400" height="1800" fill="#F4EFE4"/>
  <rect x="0" y="0" width="34" height="1800" fill="#B65343"/>

  <text x="90" y="82" class="sans micro" fill="#73382F">DIRECTION CHECKPOINT · V0</text>
  <text x="90" y="150" class="sans" font-size="58" font-weight="650">陶土红香薰机</text>
  <text x="585" y="150" class="serif" font-size="52">参考拆解与三个原创方向</text>
  <text x="2310" y="93" text-anchor="end" class="sans micro muted">只取原则 / 不复制品牌、文字或具体图形</text>
  <line x1="90" y1="184" x2="2310" y2="184" class="rule"/>

  <!-- Reference principle cards -->
  <g>
    <rect x="90" y="220" width="720" height="365" rx="2" fill="#FBF8F1" stroke="#D5C9B7" stroke-width="2"/>
    <text x="125" y="260" class="sans micro" fill="#B65343">REFERENCE 01 / 布局原则</text>
    <rect x="125" y="288" width="235" height="240" fill="#F4EFE4" stroke="#B8AA96"/>
    <rect x="153" y="310" width="179" height="92" fill="#D8C7AA"/>
    <line x1="153" y1="424" x2="332" y2="424" stroke="#292825" stroke-width="2"/>
    <rect x="153" y="444" width="52" height="52" fill="#B65343"/>
    <rect x="215" y="444" width="52" height="52" fill="#7F8B60"/>
    <rect x="277" y="444" width="55" height="52" fill="#292825"/>
    <text x="398" y="327" class="sans" font-size="32" font-weight="600">大留白 × 分段节奏</text>
    <text x="398" y="375" class="sans small muted">首屏最疏，卖点适中，参数最密</text>
    <text x="398" y="418" class="sans small muted">产品 → 主张 → 卖点 → 材质</text>
    <text x="398" y="461" class="sans small muted">细线建秩序，每段只回答一个问题</text>
    <text x="398" y="522" class="sans micro" fill="#73382F">舍弃：品牌、原图、图标、具体比例</text>
  </g>

  <g>
    <rect x="840" y="220" width="720" height="365" rx="2" fill="#FBF8F1" stroke="#D5C9B7" stroke-width="2"/>
    <text x="875" y="260" class="sans micro" fill="#B65343">REFERENCE 02 / 暖色系统</text>
    <rect x="875" y="288" width="235" height="240" fill="#292825"/>
    <rect x="895" y="308" width="195" height="130" fill="#F4EFE4"/>
    <rect x="895" y="452" width="80" height="56" fill="#B65343"/>
    <rect x="985" y="452" width="50" height="56" fill="#D8C7AA"/>
    <rect x="1045" y="452" width="45" height="56" fill="#7F8B60"/>
    <text x="1148" y="327" class="sans" font-size="32" font-weight="600">70 / 20 / 8 / 2</text>
    <text x="1148" y="375" class="sans small muted">奶油底 / 陶土识别 / 炭黑文字 / 橄榄点缀</text>
    <text x="1148" y="418" class="sans small muted">暖而不闷，产品与背景保持分离</text>
    <text x="1148" y="461" class="sans small muted">强标题层级 + 安静说明层级</text>
    <text x="1148" y="522" class="sans micro" fill="#73382F">舍弃：品牌字标、叶形标志与原纹样</text>
  </g>

  <g>
    <rect x="1590" y="220" width="720" height="365" rx="2" fill="#FBF8F1" stroke="#D5C9B7" stroke-width="2"/>
    <text x="1625" y="260" class="sans micro" fill="#B65343">REFERENCE 03 / 构图原则</text>
    <rect x="1625" y="288" width="235" height="240" fill="#F4EFE4" stroke="#B8AA96"/>
    <polygon points="1625,440 1782,288 1860,288 1684,470" fill="#B65343"/>
    <rect x="1700" y="414" width="160" height="72" fill="#292825"/>
    <rect x="1625" y="488" width="108" height="40" fill="#7F8B60"/>
    <text x="1898" y="327" class="sans" font-size="32" font-weight="600">错位 × 跨栏 × 大小反差</text>
    <text x="1898" y="375" class="sans small muted">每屏只留一个几何冲突点</text>
    <text x="1898" y="418" class="sans small muted">几何引导视线，不抢产品身份</text>
    <text x="1898" y="461" class="sans small muted">用裁切与跨栏制造“从静到动”</text>
    <text x="1898" y="522" class="sans micro" fill="#73382F">舍弃：圆弧网格、原配色与具体图案</text>
  </g>

  <!-- Territory A -->
  <g>
    <rect x="90" y="625" width="720" height="1030" fill="#FBF8F1" stroke="#CCBEA9" stroke-width="2"/>
    <text x="130" y="680" class="sans micro" fill="#B65343">TERRITORY A</text>
    <text x="130" y="724" class="sans route">余温留白</text>
    <text x="770" y="724" text-anchor="end" class="serif" font-size="28" fill="#6E675F">Residual Warmth</text>
    <g clip-path="url(#clipA)">
      <rect x="130" y="745" width="640" height="420" fill="#F4EFE4"/>
      <rect x="130" y="745" width="12" height="420" fill="#B65343"/>
      <line x1="180" y1="815" x2="720" y2="815" stroke="#73382F" stroke-width="2"/>
      <text x="180" y="792" class="sans" font-size="25" letter-spacing="3">让香气</text>
      <text x="180" y="880" class="serif" font-size="78">慢下来</text>
      <text x="183" y="922" class="sans" font-size="20" fill="#6E675F" letter-spacing="2">陶土红香薰机</text>
      <image href="product-reference-exact.png" x="268" y="865" width="520" height="520"/>
    </g>
    <text x="130" y="1215" class="sans" font-size="31" font-weight="600">安静、生活方式、留白最充分</text>
    <text x="130" y="1260" class="sans small muted">低成本机制：排版、原图裁切、单一细线。</text>
    <circle cx="145" cy="1318" r="13" fill="#F4EFE4" stroke="#B65343" stroke-width="3"/>
    <text x="175" y="1327" class="sans body"><tspan font-weight="600">H01</tspan>  首屏至少 45% 负空间</text>
    <circle cx="145" cy="1376" r="13" fill="#F4EFE4" stroke="#B65343" stroke-width="3"/>
    <text x="175" y="1385" class="sans body"><tspan font-weight="600">H02</tspan>  产品居中偏下，宽约 32%</text>
    <circle cx="145" cy="1434" r="13" fill="#F4EFE4" stroke="#B65343" stroke-width="3"/>
    <text x="175" y="1443" class="sans body"><tspan font-weight="600">H03</tspan>  暖色面积比 70 / 20 / 8 / 2</text>
    <circle cx="145" cy="1492" r="13" fill="#F4EFE4" stroke="#B65343" stroke-width="3"/>
    <text x="175" y="1501" class="sans body"><tspan font-weight="600">H04</tspan>  大标题 + 短句 + 细线足够</text>
    <line x1="130" y1="1552" x2="770" y2="1552" class="rule"/>
    <text x="130" y="1594" class="sans micro" fill="#73382F">首选目标：情绪 / 高级感 / 安静</text>
  </g>

  <!-- Territory B -->
  <g>
    <rect x="840" y="625" width="720" height="1030" fill="#F6ECE3" stroke="#CCBEA9" stroke-width="2"/>
    <text x="880" y="680" class="sans micro" fill="#B65343">TERRITORY B</text>
    <text x="880" y="724" class="sans route">陶土切面</text>
    <text x="1520" y="724" text-anchor="end" class="serif" font-size="28" fill="#6E675F">Clay Facets</text>
    <g clip-path="url(#clipB)">
      <rect x="880" y="745" width="640" height="420" fill="#B65343"/>
      <polygon points="880,745 1260,745 1080,1165 880,1165" fill="#F4EFE4"/>
      <polygon points="1285,745 1520,745 1520,955 1400,1015" fill="#73382F"/>
      <text x="905" y="1040" class="serif" font-size="180" fill="#292825">慢</text>
      <text x="925" y="1083" class="sans" font-size="22" letter-spacing="4">让香气慢下来</text>
      <rect x="1120" y="850" width="400" height="315" fill="#FFFDF8"/>
      <image href="product-reference-exact.png" x="1085" y="810" width="490" height="490"/>
    </g>
    <text x="880" y="1215" class="sans" font-size="31" font-weight="600">发布感最强，几何张力最明显</text>
    <text x="880" y="1260" class="sans small muted">低成本机制：斜切色面、文字裁切、真实近景。</text>
    <rect x="880" y="1305" width="26" height="26" fill="#B65343"/>
    <text x="925" y="1327" class="sans body"><tspan font-weight="600">H05</tspan>  单一斜切面穿过产品背景</text>
    <rect x="880" y="1363" width="26" height="26" fill="#73382F"/>
    <text x="925" y="1385" class="sans body"><tspan font-weight="600">H06</tspan>  “慢下来”大尺度裁切即构图</text>
    <rect x="880" y="1421" width="26" height="26" fill="#D8C7AA"/>
    <text x="925" y="1443" class="sans body"><tspan font-weight="600">H07</tspan>  产品原图局部表达陶土触感</text>
    <text x="880" y="1502" class="sans small muted">边界：一屏一个斜切焦点，产品始终保持正视。</text>
    <line x1="880" y1="1552" x2="1520" y2="1552" class="rule"/>
    <text x="880" y="1594" class="sans micro" fill="#73382F">首选目标：新品冲击 / 传播 / 记忆点</text>
  </g>

  <!-- Territory C -->
  <g>
    <rect x="1590" y="625" width="720" height="1030" fill="#EEE7D9" stroke="#CCBEA9" stroke-width="2"/>
    <text x="1630" y="680" class="sans micro" fill="#B65343">TERRITORY C</text>
    <text x="1630" y="724" class="sans route">静音时序</text>
    <text x="2270" y="724" text-anchor="end" class="serif" font-size="28" fill="#6E675F">Quiet Sequence</text>
    <g clip-path="url(#clipC)">
      <rect x="1630" y="745" width="640" height="420" fill="#F4EFE4"/>
      <rect x="1630" y="745" width="164" height="140" fill="#292825"/>
      <rect x="1630" y="885" width="164" height="140" fill="#7F8B60"/>
      <rect x="1630" y="1025" width="164" height="140" fill="#B65343"/>
      <text x="1660" y="815" class="sans" font-size="45" fill="#FFFDF8">01</text>
      <text x="1660" y="855" class="sans" font-size="20" fill="#FFFDF8">低噪运行</text>
      <text x="1660" y="955" class="sans" font-size="45" fill="#FFFDF8">02</text>
      <text x="1660" y="995" class="sans" font-size="20" fill="#FFFDF8">定时关闭</text>
      <text x="1660" y="1095" class="sans" font-size="45" fill="#FFFDF8">03</text>
      <text x="1660" y="1135" class="sans" font-size="20" fill="#FFFDF8">陶土触感</text>
      <line x1="1818" y1="785" x2="2242" y2="785" stroke="#B8AA96" stroke-width="2"/>
      <line x1="1818" y1="815" x2="2110" y2="815" stroke="#B65343" stroke-width="4"/>
      <line x1="1818" y1="833" x2="2070" y2="833" stroke="#B65343" stroke-width="2"/>
      <text x="1830" y="885" class="serif" font-size="53">让香气慢下来</text>
      <image href="product-reference-exact.png" x="1815" y="875" width="470" height="470"/>
    </g>
    <text x="1630" y="1215" class="sans" font-size="31" font-weight="600">功能最清晰，适合快速扫读</text>
    <text x="1630" y="1260" class="sans small muted">低成本机制：序号、线段、矩形与统一网格。</text>
    <line x1="1630" y1="1318" x2="1662" y2="1318" stroke="#292825" stroke-width="8"/>
    <text x="1685" y="1327" class="sans body"><tspan font-weight="600">H08</tspan>  01/02/03 替代通用图标</text>
    <line x1="1630" y1="1376" x2="1662" y2="1376" stroke="#7F8B60" stroke-width="8"/>
    <text x="1685" y="1385" class="sans body"><tspan font-weight="600">H09</tspan>  低振幅线 + 时间阶梯块</text>
    <line x1="1630" y1="1434" x2="1662" y2="1434" stroke="#B65343" stroke-width="8"/>
    <text x="1685" y="1443" class="sans body"><tspan font-weight="600">H10</tspan>  统一 12 栏网格，改变跨栏</text>
    <text x="1630" y="1502" class="sans small muted">边界：保留足够留白，避免变成纯参数页。</text>
    <line x1="1630" y1="1552" x2="2270" y2="1552" class="rule"/>
    <text x="1630" y="1594" class="sans micro" fill="#73382F">首选目标：功能扫读 / 电商效率 / 复用</text>
  </g>

  <line x1="90" y1="1704" x2="2310" y2="1704" class="rule"/>
  <text x="90" y="1755" class="sans" font-size="27" font-weight="600">下一步：</text>
  <text x="205" y="1755" class="sans body">请选择 A / B / C 一个主方向；选定后再制作 1 张首屏 + 2 张卖点模块。</text>
  <text x="2310" y="1755" text-anchor="end" class="sans micro muted">PRODUCT SOURCE PRESERVED EXACTLY · SHA-256 241716AA…</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="1600" viewBox="0 0 1200 1600" role="img"
     aria-labelledby="title description">
  <title id="title">让香气慢下来。— 产品详情页首屏 v2</title>
  <desc id="description">暖象牙色背景中的居中产品图、主标题与三个卖点。</desc>
  <metadata>
    {
      "version":"v2",
      "baseVersion":"v1",
      "revision":{"swapOrder":["feature-clay-touch","feature-timer"],"slotGeometryPreserved":true},
      "carriedForward":{"copyAssertion":"低噪运行","thirdSlotTranslateY":-12},
      "sourceUse":{
        "layout-a":["centered product placement","image-title-feature rhythm","three equal feature cells"],
        "palette-b":["warm ivory","charcoal","muted terracotta","muted olive","quiet sans-serif-led typography"],
        "product":["exact unmodified raster placed as a locked image object"]
      },
      "avoid":["no text or brand identity copied from layout-a","no product recolor or geometry change"]
    }
  </metadata>

  <defs>
    <clipPath id="canvasClip"><rect width="1200" height="1600" rx="0"/></clipPath>
    <clipPath id="productClip"><rect x="176" y="92" width="848" height="848" rx="22"/></clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#2E2E2B" flood-opacity="0.09"/>
    </filter>
    <linearGradient id="pageVeil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F2E7" stop-opacity="0.86"/>
      <stop offset="0.62" stop-color="#F3EDDF" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#F3EDDF" stop-opacity="0.60"/>
    </linearGradient>
  </defs>

  <g id="canvas" clip-path="url(#canvasClip)">
    <rect id="base-fill" x="0" y="0" width="1200" height="1600" fill="#F3EDDF" fill-opacity="0"/>
    <g id="ambient-background" data-render-mode="native-insert"
       data-asset="ambient_background_v0.png" data-x="0" data-y="0"
       data-width="1200" data-height="1600"/>
    <rect id="background-veil" x="0" y="0" width="1200" height="1600" fill="url(#pageVeil)"/>

    <g id="editorial-grid" fill="none" stroke="#2E2E2B" stroke-opacity="0.11" stroke-width="1">
      <line x1="64" y1="48" x2="64" y2="1552"/>
      <line x1="1136" y1="48" x2="1136" y2="1552"/>
      <line x1="64" y1="48" x2="1136" y2="48"/>
      <line x1="64" y1="1552" x2="1136" y2="1552"/>
    </g>

    <g id="product-stage" filter="url(#softShadow)">
      <rect id="product-card" x="112" y="72" width="976" height="888" rx="30"
            fill="#FBFAF7" stroke="#2E2E2B" stroke-opacity="0.10"/>
      <g id="product-image-locked" data-render-mode="native-insert"
         data-asset="product_reference_locked.png" data-x="176" data-y="92"
         data-width="848" data-height="848" data-fit="contain" data-opacity="1"/>
    </g>

    <g id="headline-block" text-anchor="middle" fill="#2E2E2B">
      <text id="headline" x="600" y="1072"
            font-family="PingFang SC, Noto Sans CJK SC, Heiti SC, sans-serif"
            font-size="72" font-weight="500" letter-spacing="3">让香气慢下来。</text>
      <rect id="headline-accent" x="565" y="1113" width="70" height="5" rx="2.5" fill="#B85C43"/>
    </g>

    <g id="feature-row">
      <g id="feature-low-noise">
        <rect id="feature-low-noise-card" x="112" y="1172" width="309" height="246" rx="24"
              fill="#F8F3E8" fill-opacity="0.90" stroke="#2E2E2B" stroke-opacity="0.12"/>
        <circle id="feature-low-noise-icon-bg" cx="266.5" cy="1250" r="39" fill="#8A9568"/>
        <g id="feature-low-noise-icon" fill="none" stroke="#FBFAF7" stroke-width="4"
           stroke-linecap="round" stroke-linejoin="round">
          <path d="M246 1253h9l10 9v-25l-10 9h-9z"/>
          <path d="M273 1243c5 4 5 11 0 15" opacity="0.95"/>
          <path d="M281 1237c9 8 9 19 0 27" opacity="0.55"/>
        </g>
        <text id="feature-low-noise-label" x="266.5" y="1361" text-anchor="middle"
              data-approved-copy="低噪运行" data-client-correction="躁→噪"
              font-family="Songti SC, Noto Serif CJK SC, serif" font-size="32" font-weight="500"
              fill="#2E2E2B" letter-spacing="1">低噪运行</text>
      </g>

      <g id="feature-clay-touch" transform="translate(-333.5,0)" data-slot="2">
        <rect id="feature-clay-touch-card" x="779" y="1172" width="309" height="246" rx="24"
              fill="#F8F3E8" fill-opacity="0.90" stroke="#2E2E2B" stroke-opacity="0.12"/>
        <circle id="feature-clay-touch-icon-bg" cx="933.5" cy="1250" r="39" fill="#2E2E2B"/>
        <g id="feature-clay-touch-icon" fill="#F3EDDF">
          <circle cx="918" cy="1238" r="3.2"/><circle cx="933" cy="1234" r="2.8"/>
          <circle cx="947" cy="1240" r="3.5"/><circle cx="923" cy="1252" r="2.5"/>
          <circle cx="939" cy="1249" r="3.1"/><circle cx="951" cy="1256" r="2.6"/>
          <circle cx="928" cy="1265" r="3.4"/><circle cx="943" cy="1266" r="2.4"/>
        </g>
        <text id="feature-clay-touch-label" x="933.5" y="1361" text-anchor="middle"
              font-family="Songti SC, Noto Serif CJK SC, serif" font-size="32" font-weight="500"
              fill="#2E2E2B" letter-spacing="1">陶土触感</text>
      </g>

      <g id="feature-timer" transform="translate(333.5,-12)" data-slot="3" data-delta-y="-12">
        <rect id="feature-timer-card" x="445.5" y="1172" width="309" height="246" rx="24"
              fill="#F8F3E8" fill-opacity="0.90" stroke="#2E2E2B" stroke-opacity="0.12"/>
        <circle id="feature-timer-icon-bg" cx="600" cy="1250" r="39" fill="#B85C43"/>
        <g id="feature-timer-icon" fill="none" stroke="#FBFAF7" stroke-width="4"
           stroke-linecap="round" stroke-linejoin="round">
          <circle cx="600" cy="1250" r="21"/>
          <path d="M600 1236v15l11 7"/>
          <path d="M591 1223h18"/>
        </g>
        <text id="feature-timer-label" x="600" y="1361" text-anchor="middle"
              font-family="Songti SC, Noto Serif CJK SC, serif" font-size="32" font-weight="500"
              fill="#2E2E2B" letter-spacing="1">定时关闭</text>
      </g>
    </g>

    <g id="bottom-rhythm" opacity="0.90">
      <rect x="112" y="1467" width="488" height="7" fill="#8A9568"/>
      <rect x="600" y="1467" width="488" height="7" fill="#B85C43"/>
    </g>
  </g>
</svg>

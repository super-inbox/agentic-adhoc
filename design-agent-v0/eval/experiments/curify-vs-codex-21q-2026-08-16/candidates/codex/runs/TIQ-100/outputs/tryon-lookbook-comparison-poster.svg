<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f5f1"/>
      <stop offset="0.55" stop-color="#eeefec"/>
      <stop offset="1" stop-color="#e8ebed"/>
    </linearGradient>
    <linearGradient id="labelFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="0.58" stop-color="#ffffff" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#26313a" flood-opacity="0.16"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#26313a" flood-opacity="0.16"/>
    </filter>
    <clipPath id="leftCard"><rect x="120" y="250" width="700" height="870" rx="28"/></clipPath>
    <clipPath id="rightCard"><rect x="980" y="250" width="700" height="870" rx="28"/></clipPath>
    <clipPath id="leftThumb"><rect x="650" y="292" width="124" height="154" rx="16"/></clipPath>
    <clipPath id="rightThumb"><rect x="1510" y="292" width="124" height="154" rx="16"/></clipPath>
  </defs>

  <rect width="1800" height="1200" fill="url(#page)"/>
  <circle cx="1720" cy="95" r="180" fill="#dbe0e3" opacity="0.55"/>
  <circle cx="80" cy="1130" r="210" fill="#dfe5dc" opacity="0.58"/>

  <g font-family="STHeiti, PingFang SC, Arial Unicode MS, sans-serif">
    <text x="120" y="66" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#616a68">AI VIRTUAL TRY-ON</text>
    <text x="120" y="138" font-size="48" font-weight="700" letter-spacing="1" fill="#171b1a">自拍一拍，换上两种风格</text>
    <text x="120" y="184" font-size="21" font-weight="400" letter-spacing="2" fill="#727a77">同一人物 · 两款单品 · 真实质感呈现</text>
    <text x="1680" y="170" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#707975">LOOKBOOK / 02</text>
  </g>

  <rect x="120" y="250" width="700" height="870" rx="28" fill="#f6f5ef" filter="url(#shadow)"/>
  <g clip-path="url(#leftCard)">
    <image xlink:href="tryon-hoodie-poster.png" x="120" y="250" width="700" height="870" preserveAspectRatio="xMidYMid slice"/>
    <rect x="120" y="250" width="700" height="175" fill="url(#labelFade)"/>
  </g>
  <g font-family="STHeiti, PingFang SC, Arial Unicode MS, sans-serif">
    <rect x="158" y="286" width="98" height="32" rx="16" fill="#879682"/>
    <text x="207" y="309" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#ffffff">LOOK 01</text>
    <text x="158" y="354" font-size="31" font-weight="700" fill="#202622">日常松弛感</text>
    <text x="158" y="391" font-size="18" letter-spacing="1" fill="#56605a">鼠尾草绿连帽卫衣</text>
  </g>
  <rect x="643" y="285" width="138" height="168" rx="20" fill="#ffffff" stroke="#ffffff" stroke-width="7" filter="url(#smallShadow)"/>
  <g clip-path="url(#leftThumb)">
    <image xlink:href="../inputs/02-garment_reference.png" x="650" y="292" width="124" height="154" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <circle cx="780" cy="1090" r="9" fill="#8f9d89"/>

  <rect x="980" y="250" width="700" height="870" rx="28" fill="#f3f5f7" filter="url(#shadow)"/>
  <g clip-path="url(#rightCard)">
    <image xlink:href="tryon-bomber-poster.png" x="980" y="250" width="700" height="870" preserveAspectRatio="xMidYMid slice"/>
    <rect x="980" y="250" width="700" height="175" fill="url(#labelFade)"/>
  </g>
  <g font-family="STHeiti, PingFang SC, Arial Unicode MS, sans-serif">
    <rect x="1018" y="286" width="98" height="32" rx="16" fill="#273a57"/>
    <text x="1067" y="309" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#ffffff">LOOK 02</text>
    <text x="1018" y="354" font-size="31" font-weight="700" fill="#172134">都市轻机能</text>
    <text x="1018" y="391" font-size="18" letter-spacing="1" fill="#4e596c">深海军蓝飞行夹克</text>
  </g>
  <rect x="1503" y="285" width="138" height="168" rx="20" fill="#ffffff" stroke="#ffffff" stroke-width="7" filter="url(#smallShadow)"/>
  <g clip-path="url(#rightThumb)">
    <image xlink:href="../inputs/03-garment_reference.png" x="1510" y="292" width="124" height="154" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <circle cx="1640" cy="1090" r="9" fill="#243753"/>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#727a77">
    <text x="120" y="1168">IDENTITY PRESERVED</text>
    <text x="1680" y="1168" text-anchor="end">PRODUCT-ACCURATE FIT VISUALIZATION</text>
  </g>
</svg>
